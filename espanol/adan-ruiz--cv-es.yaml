    skills:
      - label: "Idiomas"
        details: "Español (Nativo), Inglés (C1 - Avanzado)"

      - label: "Ingeniería de Soporte"
        details: >
          Soporte al cliente (email/chat/teléfono), Triage de incidentes, Troubleshooting de APIs REST, 
          Análisis de logs, Análisis de causa raíz (RCA), Escalamiento a ingeniería, 
          Pruebas post-instalación, Runbooks y documentación técnica.

      - label: "APIs y Herramientas"
        details: >
          REST APIs, Postman, Swagger/OpenAPI, Manejo de autenticación y paginación, 
          Mapeo de payloads, Manejo de errores y reintentos.

      - label: "Bases de Datos"
        details: >
          SQL Server, MySQL, PostgreSQL, Redis, RethinkDB, MongoDB, DynamoDB, GraphQL, 
          Sequelize ORM. Consultas SQL (joins, subconsultas, múltiples tablas), Respaldos y Restauración, Optimización.

      - label: "Backend y Arquitectura"
        details: >
          Go (Golang), C# (.NET Core), JavaScript/Node.js, TypeScript, Python, 
          Clean Architecture, CQRS, Microservicios, Principios SOLID.

      - label: "DevOps e Infraestructura"
        details: >
          AWS (EC2, Lambda, S3, RDS, DynamoDB, API Gateway), Terraform, Ansible, 
          GitLab CI/CD, GitHub Actions, VMware ESXi, Docker, Linux (Ubuntu Server), Bash.

      - label: "Seguridad y Redes"
        details: >
          UFW/iptables, OpenSSL/TLS, Passbolt, Wazuh, Node Exporter, VPNs, VLANs, 
          Endurecimiento de SSH, Control de acceso (Bastion host), RAID, iDRAC, Jira, Git.